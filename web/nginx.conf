server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location ~ ^/(users|sessions|questions|answers|review|question-flags)(/|$) {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  location = /moguratataki/ {
    try_files /moguratataki/app.html =404;
    add_header Cache-Control "no-cache";
  }

  location = /moguratataki/bugbooster/ {
    try_files /moguratataki/bugbooster/app.html =404;
    add_header Cache-Control "no-cache";
  }

  location = /moguratataki/slashbug/ {
    try_files /moguratataki/slashbug/app.html =404;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
