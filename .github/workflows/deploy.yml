name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect seed changes
        id: seed_changes
        shell: bash
        run: |
          set -e
          before_sha="${{ github.event.before }}"
          if [ -z "$before_sha" ] || [ "$before_sha" = "0000000000000000000000000000000000000000" ]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "${{ github.sha }}")"
          else
            changed_files="$(git diff --name-only "$before_sha" "${{ github.sha }}")"
          fi

          printf 'Changed files:\n%s\n' "$changed_files"

          should_seed=false
          should_build_api=false
          should_build_web=false

          if echo "$changed_files" | grep -Eq '^(api/seed-data/|api/seed\.js$)'; then
            should_seed=true
          fi

          if echo "$changed_files" | grep -Eq '^(api/|docker-compose\.yml$)'; then
            should_build_api=true
          fi

          if echo "$changed_files" | grep -Eq '^(web/|docker-compose\.yml$)'; then
            should_build_web=true
          fi

          echo "should_seed=$should_seed"
          echo "should_build_api=$should_build_api"
          echo "should_build_web=$should_build_web"

          {
            echo "should_seed=$should_seed"
            echo "should_build_api=$should_build_api"
            echo "should_build_web=$should_build_web"
          } >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        shell: bash
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          sed -i 's/\r$//' ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        shell: bash
        env:
          SHOULD_SEED: ${{ steps.seed_changes.outputs.should_seed }}
          SHOULD_BUILD_API: ${{ steps.seed_changes.outputs.should_build_api }}
          SHOULD_BUILD_WEB: ${{ steps.seed_changes.outputs.should_build_web }}
        run: |
          echo "Deploy step SHOULD_SEED=$SHOULD_SEED SHOULD_BUILD_API=$SHOULD_BUILD_API SHOULD_BUILD_WEB=$SHOULD_BUILD_WEB"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "APP_DIR='${{ secrets.APP_DIR }}' SHOULD_SEED='$SHOULD_SEED' SHOULD_BUILD_API='$SHOULD_BUILD_API' SHOULD_BUILD_WEB='$SHOULD_BUILD_WEB' bash -se" << 'EOF'
            set -e
            cd "$APP_DIR"

            git fetch origin
            git reset --hard origin/main
            git rev-parse HEAD

            docker compose up -d --build db
            echo "Remote SHOULD_SEED=$SHOULD_SEED SHOULD_BUILD_API=$SHOULD_BUILD_API SHOULD_BUILD_WEB=$SHOULD_BUILD_WEB"
            echo "Pruning old Docker cache before builds"
            docker image prune -af || true
            docker builder prune -af || true

            if [ "$SHOULD_BUILD_API" = "true" ] || [ "$SHOULD_SEED" = "true" ]; then
              echo "Building api image"
              docker compose build api
            else
              echo "Skipping api build"
            fi

            docker compose run --rm -T api npx prisma migrate deploy < /dev/null
            if [ "$SHOULD_SEED" = "true" ]; then
              echo "Running seed:master"
              docker compose run --rm -T api npm run seed:master < /dev/null
            else
              echo "Skipping seed:master"
            fi

            if [ "$SHOULD_BUILD_API" = "true" ] || [ "$SHOULD_SEED" = "true" ]; then
              docker compose up -d --force-recreate api
            else
              echo "Skipping api recreate"
            fi

            if [ "$SHOULD_BUILD_WEB" = "true" ]; then
              echo "Pruning old Docker cache before web build"
              docker image prune -af || true
              docker builder prune -af || true
              docker compose build web
              docker compose up -d --force-recreate web
              docker exec quizwell_web sh -lc 'if grep -R "localhost:3000" /usr/share/nginx/html; then exit 1; fi'
            else
              echo "Skipping web build"
            fi

            docker image prune -af || true
            docker builder prune -af || true
          EOF
